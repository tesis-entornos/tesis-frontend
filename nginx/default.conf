# Serves the built single-page application as static files.
# API routing (/api/*) is NOT handled here: it is the edge's job
# (CloudFront in AWS, e2e/edge.conf locally).
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }
}
