# End-to-end test stack. The backend is consumed as an IMAGE (never as source code),
# so every E2E run is tied to a backend image and a frontend image.
#
#   BACKEND_IMAGE=tesis-backend:local       (or registry/repo@sha256:...)
#   FRONTEND_IMAGE=tesis-frontend:local     (or registry/repo@sha256:...)
#
# Application images are never built here: scripts/run-e2e.sh builds
# tesis-frontend:local only when FRONTEND_IMAGE is not given. Images missing
# locally are pulled (pull_policy: missing), so digest references work.
#
# The backend runs in production mode (no FASTAPI_ENV), as in AWS. Secrets come
# from E2E_* variables that scripts/run-e2e.sh generates for every run.
#
# Usage: ./scripts/run-e2e.sh
services:
  db:
    image: postgres:18@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d app"]
      interval: 5s
      retries: 10
      start_period: 30s
      timeout: 5s
    environment:
      - POSTGRES_PASSWORD=${E2E_POSTGRES_PASSWORD:?run scripts/run-e2e.sh}
      - POSTGRES_DB=app

  mailpit:
    image: axllent/mailpit:v1.27@sha256:e22dce5b36f93c77082e204a3942fb6b283b7896e057458400a4c88344c3df68

  redis:
    image: redis:7.2-alpine@sha256:2c933526722b4126a61d5c170f766dc159adf97682f0b1cbbc27b1666ba96d84
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # S3 emulator and bucket initializer (see tesis-backend compose.yml)
  s3:
    image: motoserver/moto:5.2.5@sha256:59a1965d845249b04def37a0e2565f9cc6c44543cb89b68e90f28f344b3b0d1a

  s3-init:
    image: amazon/aws-cli:2.39.3@sha256:d557b3524475d70dd3104cf44d96568ee3188897b73a6ece2b37aa50e1af362f
    depends_on:
      - s3
    environment:
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test
      AWS_DEFAULT_REGION: us-east-1
    entrypoint: ["sh", "-c"]
    command:
      - >-
        for i in $$(seq 1 30); do
        aws --endpoint-url http://s3:5000 s3api head-bucket --bucket tesis-files 2>/dev/null && exit 0;
        aws --endpoint-url http://s3:5000 s3api create-bucket --bucket tesis-files && exit 0;
        sleep 1; done; exit 1

  prestart:
    image: ${BACKEND_IMAGE:-tesis-backend:local}
    pull_policy: missing
    depends_on:
      db:
        condition: service_healthy
    command: bash scripts/prestart.sh
    environment: &backend-env
      PROJECT_NAME: "Full Stack FastAPI Project"
      SECRET_KEY: ${E2E_SECRET_KEY:?run scripts/run-e2e.sh}
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: ${E2E_SUPERUSER_PASSWORD:?run scripts/run-e2e.sh}
      FRONTEND_HOST: http://edge
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_TLS: "false"
      EMAILS_FROM_EMAIL: info@example.com
      DATABASE_URL: postgresql://postgres:${E2E_POSTGRES_PASSWORD:?run scripts/run-e2e.sh}@db:5432/app
      REDIS_URL: redis://redis:6379/0
      # Required with REDIS_URL since backend D3 (unique per environment)
      CACHE_KEY_PREFIX: ${E2E_CACHE_KEY_PREFIX:-e2e}
      S3_BUCKET: tesis-files
      AWS_REGION: us-east-1
      S3_ENDPOINT_URL: http://s3:5000
      S3_FORCE_PATH_STYLE: "true"
      # Fake credentials for the local emulator only
      AWS_ACCESS_KEY_ID: test
      AWS_SECRET_ACCESS_KEY: test

  backend:
    image: ${BACKEND_IMAGE:-tesis-backend:local}
    pull_policy: missing
    depends_on:
      prestart:
        condition: service_completed_successfully
      mailpit:
        condition: service_started
      redis:
        condition: service_healthy
      s3-init:
        condition: service_completed_successfully
    environment: *backend-env
    healthcheck:
      test:
        [
          "CMD",
          "curl",
          "-f",
          "http://localhost:8000/api/v1/utils/health-check/",
        ]
      interval: 5s
      timeout: 5s
      retries: 10

  frontend:
    image: ${FRONTEND_IMAGE:-tesis-frontend:local}
    pull_policy: missing

  # Emulates CloudFront path routing (see e2e/edge.conf)
  edge:
    image: nginx:1.28-alpine@sha256:a8b39bd9cf0f83869a2162827a0caf6137ddf759d50a171451b335cecc87d236
    volumes:
      - ./e2e/edge.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      backend:
        condition: service_healthy
      frontend:
        condition: service_started
    ports:
      - "${EDGE_PORT:-8888}:80"

  playwright:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    ipc: host
    depends_on:
      edge:
        condition: service_started
    environment:
      FIRST_SUPERUSER: admin@example.com
      FIRST_SUPERUSER_PASSWORD: ${E2E_SUPERUSER_PASSWORD:?run scripts/run-e2e.sh}
      PLAYWRIGHT_BASE_URL: http://edge
      VITE_API_URL: http://edge
      MAILPIT_HOST: http://mailpit:8025
      PLAYWRIGHT_HTML_HOST: 0.0.0.0
      PLAYWRIGHT_WORKERS: ${PLAYWRIGHT_WORKERS:-}
      PLAYWRIGHT_RETRIES: ${PLAYWRIGHT_RETRIES:-0}
      CI: ${CI:-}
    volumes:
      - ./blob-report:/app/blob-report
      - ./test-results:/app/test-results
      - ./playwright-report:/app/playwright-report
